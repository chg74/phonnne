<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Phone UI</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    color:#fff;
}

.app{
    width:100%;
    height:100vh;
    min-height:100vh;
    background:#000;
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* STATUS */

.status{
    height:47px;
    padding:5px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#000;
    color:#fff;
    font-size:13px;
    font-weight:bold;
}

/* CONTACTS */

.contact-area{
    position:absolute;
    top:47px;
    left:0;
    right:0;
    height:calc(43vh - 47px);
    background:#000;
    padding:7px 36px 0;
    overflow:hidden;
}

.contact-row{
    height:58px;
    display:flex;
    align-items:center;
    gap:18px;
    color:#fff;
}

.contact-icon{
    width:38px;
    min-width:38px;
    height:38px;
    position:relative;
}

.person-icon:before{
    content:"";
    position:absolute;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#fff;
    left:12px;
    top:0;
}

.person-icon:after{
    content:"";
    position:absolute;
    width:34px;
    height:19px;
    border-radius:19px 19px 7px 7px;
    background:#fff;
    left:2px;
    bottom:0;
}

.video-icon{
    border:3px solid #fff;
    border-radius:4px;
    width:33px;
    height:24px;
    margin-left:1px;
}

.video-icon:after{
    content:"";
    position:absolute;
    right:-10px;
    top:3px;
    border-top:7px solid transparent;
    border-bottom:7px solid transparent;
    border-left:9px solid #fff;
}

.message-icon{
    width:38px;
    height:25px;
    border-radius:15px;
    background:#fff;
}

.message-icon:after{
    content:"";
    position:absolute;
    bottom:0;
    left:7px;
    border-top:11px solid #fff;
    border-right:8px solid transparent;
}

.contact-text{
    font-size:16px;
    font-weight:600;
}

/* DIALER */

.dialer{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:58vh;
    background:#5a484b;
    border-radius:24px 24px 0 0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.number-bar{
    height:61px;
    flex-shrink:0;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0 55px;
}

.display{
    width:100%;
    text-align:center;
    font-size:23px;
    font-weight:500;
    direction:ltr;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    outline:none;
    border:none;
    background:transparent;
    color:#fff;
    caret-color:#fff;
    padding:0;
    height:40px;
    user-select:text;
    -webkit-user-select:text;
}

.display:focus{
    outline:none;
}

.more{
    position:absolute;
    left:24px;
    top:20px;
    width:20px;
    height:25px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
}

.more i{
    width:4px;
    height:4px;
    background:#fff;
    border-radius:50%;
}

.delete-top{
    position:absolute;
    right:17px;
    top:14px;
    width:43px;
    height:34px;
    border:0;
    background:transparent;
    display:none;
    align-items:center;
    justify-content:center;
    padding:0;
}

.delete-svg{
    width:29px;
    height:23px;
    display:block;
    transition:transform .08s ease;
}

.delete-top:active .delete-svg{
    transform:scale(.86);
}

/* KEYPAD */

.keypad{
    flex:1;
    padding:0 23px 6px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:7px 20px;
}

.key{
    border:0;
    min-height:0;
    border-radius:36px;
    background:#251e20;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-size:24px;
    font-weight:400;
    user-select:none;
    cursor:pointer;
    transition:transform .08s,background .08s;
}

.key small{
    margin-top:2px;
    font-size:9px;
    font-weight:bold;
    line-height:1;
}

.key:active{
    transform:scale(.94);
    background:#403638;
}

/* CALL */

.call-area{
    height:68px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.call{
    width:272px;
    max-width:72%;
    height:53px;
    border:0;
    border-radius:33px;
    background:#5fe19b;
    color:#17382a;
    font-size:23px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    cursor:pointer;
    transition:transform .08s ease;
}

.real-phone-icon{
    width:27px;
    height:27px;
    fill:#0b7a43;
    display:block;
}

.call:active{
    transform:scale(.94);
}

/* BOTTOM */

.bottom{
    height:61px;
    flex-shrink:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    align-items:center;
    text-align:center;
    color:#d0c5c7;
    background:#4d3e41;
    padding:0;
}

.nav-item{
    height:61px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:2px;
    font-size:11px;
    font-weight:bold;
    color:#d0c5c7;
    line-height:1;
}

.nav-icon{
    width:36px;
    height:27px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    flex-shrink:0;
}

.nav-item.active{
    color:#fff;
}

.nav-item.active .nav-icon{
    width:55px;
    height:37px;
    border-radius:23px;
    background:#b6818e;
    font-size:22px;
}

/* USSD */

.ussd-overlay{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.42);
    padding:20px;
}

.ussd-box{
    width:230px;
    min-height:122px;
    background:#303030;
    border-radius:21px;
    padding:21px 19px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#fff;
    box-shadow:0 12px 40px rgba(0,0,0,.6);
}

.android-spinner{
    width:36px;
    height:36px;
    display:block;
    animation:androidRotate 1s linear infinite;
}

.android-spinner circle{
    transform-origin:50% 50%;
    animation:androidDash 1.4s ease-in-out infinite;
}

@keyframes androidRotate{
    100%{
        transform:rotate(360deg);
    }
}

@keyframes androidDash{
    0%{
        stroke-dasharray:1,150;
        stroke-dashoffset:0;
    }

    50%{
        stroke-dasharray:90,150;
        stroke-dashoffset:-35;
    }

    100%{
        stroke-dasharray:90,150;
        stroke-dashoffset:-125;
    }
}

.ussd-title{
    margin-top:14px;
    font-size:14px;
    font-weight:400;
    text-align:center;
    direction:rtl;
    color:#fff;
}

/* POPUP */

.overlay{
    position:fixed;
    inset:0;
    z-index:700;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.55);
    padding:20px;
}

.popup{
    width:88%;
    max-width:340px;
    background:#403838;
    border-radius:21px;
    padding:16px;
    color:#fff;
    direction:rtl;
    box-shadow:0 15px 45px rgba(0,0,0,.7);

    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:stretch;
}

.title{
    direction:ltr;
    text-align:left;
    font-size:16px;
    font-weight:bold;
    margin-bottom:13px;
    flex-shrink:0;
}

.title span{
    display:inline-flex;
    width:20px;
    height:20px;
    align-items:center;
    justify-content:center;
    background:#777;
    border-radius:5px;
    font-size:10px;
    margin-right:5px;
}

.message{
    text-align:right;
    font-size:14px;
    line-height:1.7;
    flex-shrink:0;
}

/* خانة الرقم السري */

#password{
    width:100%;
    height:43px;
    border:2px solid #72c6e7;
    border-radius:15px;
    background:transparent;
    color:#fff;
    outline:none;
    text-align:center;
    font-size:18px;
    margin-top:16px;
    margin-bottom:9px;
    flex-shrink:0;
    direction:ltr;
}

/* الخطأ */

#error{
    display:none;
    color:#ff7070;
    text-align:center;
    font-size:12px;
    margin-top:0;
    margin-bottom:7px;
    flex-shrink:0;
}

/* الأزرار */

.buttons{
    display:flex;
    gap:9px;
    direction:ltr;
    flex-shrink:0;
}

.buttons button{
    flex:1;
    height:43px;
    border:0;
    border-radius:23px;
    font-size:14px;
}

.cancel{
    background:#655d5d;
    color:#fff;
}

.send{
    background:#7ed9e8;
    color:#16363c;
    font-weight:bold;
}

/* ===================================
   خانة 0: المزيد
   نفس شكل خانة الرقم السري
   =================================== */

#menu2 .input{
    width:100%;
    height:43px;
    border:2px solid #72c6e7;
    border-radius:15px;
    background:transparent;
    color:#fff;
    outline:none;
    text-align:center;
    font-size:18px;
    margin-top:16px;
    margin-bottom:9px;
    flex-shrink:0;
    direction:ltr;
}

#menu2 .input:focus{
    border-color:#72c6e7;
    outline:none;
}

/* NOTIFICATION */

.notification{
    position:fixed;
    top:10px;
    left:9px;
    right:9px;
    z-index:9999;
    display:none;
    align-items:flex-start;
    padding:10px 12px;
    border-radius:15px;
    background:#292929;
    color:#fff;
    box-shadow:0 7px 30px rgba(0,0,0,.65);
    direction:rtl;
}

.message-notif-icon{
    width:36px;
    height:36px;
    min-width:36px;
    border-radius:11px;
    background:#6d6d6d;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-left:8px;
    position:relative;
}

.message-notif-icon span{
    width:22px;
    height:16px;
    background:#fff;
    border-radius:5px;
    position:relative;
    display:block;
}

.message-notif-icon span:after{
    content:"";
    position:absolute;
    bottom:-5px;
    right:4px;
    border-top:6px solid #fff;
    border-left:6px solid transparent;
}

.notif-content{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
}

.notif-header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    direction:rtl;
}

.notif-header strong{
    font-size:11px;
    font-weight:400;
    color:#ddd;
}

.notif-time{
    color:#aaa;
    font-size:9px;
    font-weight:400;
}

.notif-app{
    font-size:12px;
    font-weight:bold;
    color:#fff;
}

.notif-content > span{
    font-size:11px;
    line-height:1.5;
    color:#fff;
}

@keyframes notificationIn{
    from{
        transform:translateY(-130%);
        opacity:0;
    }

    to{
        transform:translateY(0);
        opacity:1;
    }
}

@keyframes notificationOut{
    from{
        transform:translateY(0);
        opacity:1;
    }

    to{
        transform:translateY(-130%);
        opacity:0;
    }
}

/* SHORT SCREENS */

@media(max-height:700px){

    .status{
        height:42px;
        padding:5px 20px;
    }

    .contact-area{
        top:42px;
        height:calc(43vh - 42px);
        padding:3px 31px 0;
    }

    .contact-row{
        height:50px;
        gap:16px;
    }

    .contact-text{
        font-size:14px;
    }

    .contact-icon{
        transform:scale(.9);
    }

    .number-bar{
        height:52px;
    }

    .display{
        font-size:20px;
    }

    .keypad{
        gap:6px 16px;
        padding-left:20px;
        padding-right:20px;
    }

    .key{
        font-size:21px;
        border-radius:32px;
    }

    .key small{
        font-size:8px;
    }

    .call-area{
        height:59px;
    }

    .call{
        width:260px;
        height:48px;
        font-size:21px;
    }

    .real-phone-icon{
        width:25px;
        height:25px;
    }

    .bottom{
        height:55px;
    }

    .nav-item{
        height:55px;
        font-size:10px;
    }

    .nav-icon{
        height:25px;
        font-size:19px;
    }

    .nav-item.active .nav-icon{
        width:52px;
        height:34px;
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="status">
        <span id="clock">3:00</span>
    </div>

    <div class="contact-area">

        <div class="contact-row" id="createContact">
            <div class="contact-icon person-icon"></div>
            <div class="contact-text">Create new contact</div>
        </div>

        <div class="contact-row" id="addContact">
            <div class="contact-icon person-icon"></div>
            <div class="contact-text">Add to a contact</div>
        </div>

        <div class="contact-row" id="videoCall">
            <div class="contact-icon video-icon"></div>
            <div class="contact-text">Video call</div>
        </div>

        <div class="contact-row" id="sendMessage">
            <div class="contact-icon message-icon"></div>
            <div class="contact-text">Send a message</div>
        </div>

    </div>

    <div class="dialer">

        <div class="number-bar">

            <div class="more">
                <i></i>
                <i></i>
                <i></i>
            </div>

            <input
                type="text"
                id="display"
                class="display"
                inputmode="none"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
            >

            <button
                class="delete-top"
                id="deleteButton"
                onclick="backspace()"
            >

                <svg
                    class="delete-svg"
                    viewBox="0 0 48 32"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="M17 3 H39 C43 3 46 6 46 10 V22 C46 26 43 29 39 29 H17 L3 16 Z"
                        fill="#F5F5F5"
                    />

                    <path
                        d="M25 10 L35 21 M35 10 L25 21"
                        stroke="#171717"
                        stroke-width="2.8"
                        stroke-linecap="round"
                    />

                </svg>

            </button>

        </div>

        <div class="keypad">

            <button class="key" onclick="add('1')">
                1
                <small>Q</small>
            </button>

            <button class="key" onclick="add('2')">
                2
                <small>ABC</small>
            </button>

            <button class="key" onclick="add('3')">
                3
                <small>DEF</small>
            </button>

            <button class="key" onclick="add('4')">
                4
                <small>GHI</small>
            </button>

            <button class="key" onclick="add('5')">
                5
                <small>JKL</small>
            </button>

            <button class="key" onclick="add('6')">
                6
                <small>MNO</small>
            </button>

            <button class="key" onclick="add('7')">
                7
                <small>PQRS</small>
            </button>

            <button class="key" onclick="add('8')">
                8
                <small>TUV</small>
            </button>

            <button class="key" onclick="add('9')">
                9
                <small>WXYZ</small>
            </button>

            <button class="key" onclick="add('*')">
                *
            </button>

            <button class="key" onclick="add('0')">
                0
                <small>+</small>
            </button>

            <button class="key" onclick="add('#')">
                #
            </button>

        </div>

        <div class="call-area">

            <button class="call" onclick="startCall()">

                <svg
                    class="real-phone-icon"
                    viewBox="0 0 24 24"
                >

                    <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.32.56 3.57.56a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C11.61 21 3 12.39 3 2a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.19 2.45.56 3.57a1 1 0 0 1-.24 1.02l-2.2 2.2z"></path>

                </svg>

                <span>Call</span>

            </button>

        </div>

        <div class="bottom">

            <div class="nav-item">
                <div class="nav-icon">◷</div>
                <div>Recents</div>
            </div>

            <div class="nav-item">
                <div class="nav-icon">●●</div>
                <div>Contacts</div>
            </div>

            <div class="nav-item active">
                <div class="nav-icon">⠿</div>
                <div>Keypad</div>
            </div>

        </div>

    </div>

</div>


<!-- USSD -->

<div class="ussd-overlay" id="ussdLoading">

    <div class="ussd-box">

        <svg
            class="android-spinner"
            viewBox="0 0 50 50"
        >

            <circle
                cx="25"
                cy="25"
                r="20"
                fill="none"
                stroke="#8ab4f8"
                stroke-width="4"
                stroke-linecap="round"
                stroke-dasharray="70 150"
            ></circle>

        </svg>

        <div
            class="ussd-title"
            id="loadingText"
        >
            جاري تنفيذ الطلب...
        </div>

    </div>

</div>


<!-- PASSWORD MENU -->

<div class="overlay" id="menu1">

    <div class="popup">

        <div class="title">
            <span>2</span>
            Carrier info
        </div>

        <div class="message">

            ادخل الرقم السري

            <br>

            1: الإعادة

            <br>

            2: معرفة الرسوم

            <br>

            00: الرجوع

        </div>

        <div
            class="error"
            id="error"
        >
            الرقم السري غير صحيح
        </div>

        <input
            id="password"
            class="input"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
        >

        <div class="buttons">

            <button
                class="cancel"
                onclick="closeMenu()"
            >
                Cancel
            </button>

            <button
                class="send"
                onclick="checkPassword()"
            >
                Send
            </button>

        </div>

    </div>

</div>


<!-- RESULT MENU -->

<div class="overlay" id="menu2">

    <div class="popup">

        <div class="title">
            <span>2</span>
            Carrier info
        </div>

        <div
            class="message"
            id="result"
        ></div>

        <div class="message">
            0: المزيد
        </div>

        <!-- نفس خانة الرقم السري -->
        <input
            class="input"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
        >

        <div class="buttons">

            <button
                class="cancel"
                onclick="resetAll()"
            >
                Cancel
            </button>

            <button
                class="send"
                onclick="resetAll()"
            >
                Send
            </button>

        </div>

    </div>

</div>


<!-- NOTIFICATION -->

<div
    class="notification"
    id="notification"
>

    <div class="icon message-notif-icon">
        <span></span>
    </div>

    <div class="notif-content">

        <div class="notif-header">

            <strong>رسالة</strong>

            <span class="notif-time">
                الآن
            </span>

        </div>

        <strong class="notif-app">
            Vodafone Crash
        </strong>

        <span id="notifText"></span>

    </div>

</div>


<script>

let number = "";


/* CONTACTS */

function updateContacts(){

    const count =
        number.replace(/\D/g,"").length;

    const create =
        document.getElementById("createContact");

    const addContact =
        document.getElementById("addContact");

    const video =
        document.getElementById("videoCall");

    const message =
        document.getElementById("sendMessage");

    create.style.display = "none";
    addContact.style.display = "none";
    video.style.display = "none";
    message.style.display = "none";

    if(count >= 1)
        addContact.style.display = "flex";

    if(count >= 2)
        create.style.display = "flex";

    if(count >= 3)
        video.style.display = "flex";

    if(count >= 4)
        message.style.display = "flex";
}


/* DELETE BUTTON */

function updateDeleteButton(){

    document.getElementById(
        "deleteButton"
    ).style.display =
        number.length > 0
        ? "flex"
        : "none";
}


/* ADD */

function add(value){

    number += value;

    document.getElementById(
        "display"
    ).value = number;

    updateContacts();
    updateDeleteButton();
}


/* BACKSPACE */

function backspace(){

    number =
        number.slice(0,-1);

    document.getElementById(
        "display"
    ).value = number;

    updateContacts();
    updateDeleteButton();
}


/* PASTE */

document
.getElementById("display")
.addEventListener(
    "paste",
    function(e){

        e.preventDefault();

        let text =
            (
                e.clipboardData ||
                window.clipboardData
            ).getData("text");

        text =
            text.replace(
                /[^0-9*#]/g,
                ""
            );

        number += text;

        this.value = number;

        updateContacts();
        updateDeleteButton();

    }
);


/* INPUT */

document
.getElementById("display")
.addEventListener(
    "input",
    function(){

        number =
            this.value.replace(
                /[^0-9*#]/g,
                ""
            );

        this.value = number;

        updateContacts();
        updateDeleteButton();

    }
);


/* LOADING */

function showLoading(text){

    document.getElementById(
        "loadingText"
    ).textContent = text;

    document.getElementById(
        "ussdLoading"
    ).style.display = "flex";
}

function hideLoading(){

    document.getElementById(
        "ussdLoading"
    ).style.display = "none";
}


/* CALL */

function startCall(){

    const pattern =
        /^\*9\*7\*\d+\*\d+#$/;

    if(!pattern.test(number)){

        alert(
            "اكتب الكود بالشكل:\n\n" +
            "*9*7*رقم الهاتف*المبلغ#"
        );

        return;
    }

    showLoading(
        "تشغيل USSD..."
    );

    setTimeout(
        function(){

            hideLoading();

            document.getElementById(
                "menu1"
            ).style.display = "flex";

        },
        2000
    );
}


/* CLOSE */

function closeMenu(){

    document.getElementById(
        "menu1"
    ).style.display = "none";

    document.getElementById(
        "password"
    ).value = "";

    document.getElementById(
        "error"
    ).style.display = "none";
}


/* PASSWORD */

function checkPassword(){

    const password =
        document.getElementById(
            "password"
        ).value.trim();

    if(password !== "500500"){

        document.getElementById(
            "error"
        ).style.display = "block";

        return;
    }

    document.getElementById(
        "error"
    ).style.display = "none";

    let data =
        number.replace(
            "*9*7*",
            ""
        );

    data =
        data.replace(
            /#$/,
            ""
        );

    let parts =
        data.split("*");

    let phone =
        parts[0] || "";

    let amount =
        parts[1] || "0";

    document.getElementById(
        "menu1"
    ).style.display = "none";

    showLoading(
        "تشغيل USSD..."
    );

    setTimeout(
        function(){

            hideLoading();

            document.getElementById(
                "result"
            ).innerHTML =

                `تم تحويل <b>${amount} جنيه</b> لرقم<br>
                <b>${phone}</b><br>
                مصاريف الخدمة <b>1 جنيه</b><br>
                اطلب <b>*9#</b> واشحن`;

            document.getElementById(
                "menu2"
            ).style.display = "flex";

            showNotification(
                phone,
                amount
            );

        },
        3200
    );
}


/* NOTIFICATION SOUND */

function playNotificationSound(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext)
            return;

        const audio =
            new AudioContext();

        if(audio.state === "suspended"){
            audio.resume();
        }

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.type =
            "sine";

        oscillator.frequency.setValueAtTime(
            1050,
            audio.currentTime
        );

        oscillator.frequency.setValueAtTime(
            800,
            audio.currentTime + 0.13
        );

        gain.gain.setValueAtTime(
            0.0001,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.42,
            audio.currentTime + 0.03
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audio.currentTime + 0.45
        );

        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime + 0.45
        );

        setTimeout(
            function(){
                audio.close();
            },
            600
        );

    }catch(e){

        console.log(
            "Notification sound unavailable"
        );

    }
}


/* NOTIFICATION */

function showNotification(
    phone,
    amount
){

    document.getElementById(
        "notifText"
    ).textContent =
        `تم تحويل ${amount} جنيه إلى ${phone}`;

    const notification =
        document.getElementById(
            "notification"
        );

    notification.style.display =
        "flex";

    notification.style.animation =
        "none";

    void notification.offsetWidth;

    notification.style.animation =
        "notificationIn .35s ease";

    playNotificationSound();

    setTimeout(
        function(){

            notification.style.animation =
                "notificationOut .35s ease";

            setTimeout(
                function(){

                    notification.style.display =
                        "none";

                },
                350
            );

        },
        5000
    );
}


/* RESET */

function resetAll(){

    document.getElementById(
        "menu1"
    ).style.display = "none";

    document.getElementById(
        "menu2"
    ).style.display = "none";

    document.getElementById(
        "ussdLoading"
    ).style.display = "none";

    number = "";

    document.getElementById(
        "display"
    ).value = "";

    document.getElementById(
        "password"
    ).value = "";

    document.getElementById(
        "error"
    ).style.display = "none";

    updateContacts();
    updateDeleteButton();
}


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(e){

        const display =
            document.getElementById(
                "display"
            );

        if(
            document.activeElement ===
            display
        ){
            return;
        }

        if(
            (e.key >= "0" &&
             e.key <= "9") ||
            e.key === "*" ||
            e.key === "#"
        ){

            add(e.key);
        }

        if(e.key === "Backspace"){

            backspace();
        }

        if(e.key === "Enter"){

            if(
                document.getElementById(
                    "menu1"
                ).style.display === "flex"
            ){

                checkPassword();

            }else{

                startCall();

            }
        }

    }
);


/* CLOCK */

function updateClock(){

    const d =
        new Date();

    let hours =
        d.getHours();

    let minutes =
        String(
            d.getMinutes()
        ).padStart(2,"0");

    hours =
        hours % 12;

    if(hours === 0){
        hours = 12;
    }

    document.getElementById(
        "clock"
    ).textContent =
        hours + ":" + minutes;
}

updateClock();

setInterval(
    updateClock,
    60000
);


/* INITIAL */

updateContacts();
updateDeleteButton();

</script>
